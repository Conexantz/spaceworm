<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Space Worm 3D: a cosmic snake-growth arena. Grow, bite rivals and swallow planets for stacking powers in free-for-all or 6v6 team battles.">
<meta name="theme-color" content="#05041a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Space Worm 3D">
<meta property="og:description" content="Grow. Bite. Swallow the sky.">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Space Worm 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&family=Unbounded:wght@500;700;900&display=swap">
<style>
/* Layout: full-bleed WebGL arena. HUD hugs the four corners inside safe-area insets.
   Menus are a left-anchored glass column floating over the live attract-mode arena. */
:root{
  --void:#05041a; --deep:#0d0a2b; --glass:rgba(16,12,46,.68); --glass-2:rgba(32,26,82,.74);
  --line:rgba(176,164,255,.22); --ink:#efeeff; --muted:#aaa6d9; --dim:#6f6aa3;
  --mint:#6ef3c5; --peach:#ffb36b; --rose:#ff6f9f; --violet:#9b7bff;
  --edible:#7dff9a; --hazard:#ff4d5e; --warn:#ffd24d; --nova:#4fd1ff; --ember:#ff7a4f; --gold:#ffd36b;
  --f-display:'Unbounded','Noto Sans SC',system-ui,sans-serif;
  --f-ui:'Chakra Petch','Noto Sans SC',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--void);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 30% 20%,#1d1250 0%,#0a0726 45%,var(--void) 100%);
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .6s var(--ease)}
#loading.out{opacity:0;pointer-events:none}
.load-card{width:min(520px,100%);display:grid;gap:22px}
.logo{font-family:var(--f-display);font-weight:900;letter-spacing:-.02em;line-height:.88;font-size:clamp(40px,9vw,84px);text-wrap:balance}
.logo .w{display:block;background:linear-gradient(100deg,var(--mint),#8f9bff 45%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .d3{display:inline-block;font-size:.42em;vertical-align:.95em;margin-left:.18em;padding:.12em .32em .1em;border:2px solid var(--peach);color:var(--peach);border-radius:.4em;letter-spacing:.04em}
.load-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.load-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--peach));border-radius:6px;transition:width .35s var(--ease)}
.load-stages{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.load-stages li{display:flex;gap:10px;align-items:center}
.load-stages li::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.load-stages li.on{color:var(--ink)} .load-stages li.on::before{background:var(--peach);border-color:var(--peach);animation:pulse 1s infinite}
.load-stages li.done{color:var(--mint)} .load-stages li.done::before{background:var(--mint);border-color:var(--mint)}
.load-err{color:var(--hazard);font-size:14px}
@keyframes pulse{50%{opacity:.35}}

/* ---------- menu ---------- */
.screen{position:fixed;inset:0;z-index:20;overflow:auto;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#menu{background:linear-gradient(90deg,rgba(5,4,26,.92) 0%,rgba(5,4,26,.72) 38%,rgba(5,4,26,0) 72%);display:flex;align-items:center}
.menu-col{width:min(470px,100%);display:grid;gap:22px;margin-left:clamp(0px,4vw,64px)}
.tagline{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--peach);font-weight:600}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;text-align:left;padding:18px 20px;border-radius:18px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .18s var(--ease),border-color .18s,background .18s}
.mode:hover{transform:translateX(4px);border-color:rgba(110,243,197,.6);background:var(--glass-2)}
.mode b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.mode small{grid-column:1;color:var(--muted);font-size:13px;letter-spacing:.04em}
.mode .go{grid-row:1/3;grid-column:2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:#06231a;font-weight:700;font-size:18px}
.mode.team .go{background:linear-gradient(135deg,var(--nova) 50%,var(--ember) 50%);color:#0b0a20}
.sub-nav{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background .15s,border-color .15s}
.pill:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.profile-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dust{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:rgba(255,211,107,.1);border:1px solid rgba(255,211,107,.35);color:var(--gold);font-weight:700}
.dust::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 10px rgba(255,211,107,.6)}
.field{display:grid;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{font-size:15px;letter-spacing:0;text-transform:none;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);min-width:0}
.hint{font-size:12px;color:var(--dim);letter-spacing:.04em}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:11px;color:var(--ink)}

/* ---------- panels ---------- */
.panel-wrap{background:rgba(4,3,20,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:30}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(28,22,74,.95),rgba(13,10,43,.97));border:1px solid var(--line);border-radius:22px;padding:24px;display:grid;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.panel h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.01em}
.panel h3{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--peach)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:18px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:12px;display:grid;gap:10px;align-content:start}
.card.sel{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint) inset}
.swatch{height:54px;border-radius:27px;position:relative;overflow:hidden}
.swatch::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 30% 25%,rgba(255,255,255,.55),transparent 60%)}
.card .nm{font-weight:700;font-size:14px}
.card button{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:13px}
.card button.buy{background:rgba(255,211,107,.14);border-color:rgba(255,211,107,.45);color:var(--gold)}
.card button.on{background:var(--mint);color:#06231a;border-color:var(--mint)}
.card button:disabled{opacity:.45;cursor:not-allowed}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rec{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;gap:2px}
.rec span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rec b{font-family:var(--f-display);font-size:22px;font-weight:700}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.lb td{padding:8px;border-bottom:1px solid rgba(176,164,255,.08)}
table.lb td.r{text-align:right}
table.lb tr.me td{color:var(--mint);font-weight:700}
.tbl-wrap{overflow-x:auto}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:14px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--mint)}
input[type=range]{width:100%;accent-color:var(--mint)}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 6px;background:rgba(255,255,255,.03);border:0;font-size:13px;font-weight:600}
.seg button.on{background:var(--mint);color:#06231a}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.howto div{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.howto b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.btn{padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;letter-spacing:.04em}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#06231a}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.note{font-size:13px;color:var(--muted)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-family:var(--f-ui)}
.hud-tl{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));display:grid;gap:6px}
.score-big{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.6);transition:transform .15s}
.score-big.bump{transform:scale(1.12)}
.score-lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:9px;background:rgba(10,8,34,.62);border:1px solid var(--line);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.chip b{color:var(--ink);font-weight:700}
.hud-tc{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:6px}
#hTimer{font-family:var(--f-display);font-weight:700;font-size:20px;padding:4px 14px;border-radius:12px;background:rgba(10,8,34,.6);border:1px solid var(--line)}
#hTimer.low{color:var(--hazard);border-color:rgba(255,77,94,.6);animation:pulse .8s infinite}
#hTeams{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
#hTeams .nova{color:var(--nova)} #hTeams .ember{color:var(--ember)} #hTeams .vs{font-size:11px;color:var(--dim);letter-spacing:.2em}
.hud-tr{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:grid;gap:8px;justify-items:end}
#minimap{width:150px;height:150px;border-radius:50%;background:rgba(8,6,30,.55);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.4)}
#hBoard{list-style:none;margin:0;padding:8px 10px;border-radius:12px;background:rgba(10,8,34,.6);border:1px solid var(--line);font-size:12px;display:grid;gap:2px;min-width:150px}
#hBoard li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
#hBoard li.me{color:var(--mint);font-weight:700}
#hBoard li .crown{color:var(--gold)}
#feed{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(330px + env(safe-area-inset-top,0px));display:grid;gap:4px;justify-items:end;font-size:12px}
#feed div{padding:3px 9px;border-radius:8px;background:rgba(10,8,34,.62);border:1px solid var(--line);animation:feedIn .3s var(--ease)}
@keyframes feedIn{from{opacity:0;transform:translateX(12px)}}
.hud-bl{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;max-width:46vw}
#powers,#buffs{display:flex;gap:6px;flex-wrap:wrap}
.pw{display:flex;align-items:center;gap:6px;padding:5px 9px 5px 6px;border-radius:10px;background:rgba(10,8,34,.66);border:1px solid var(--line);font-size:12px;font-weight:600;animation:feedIn .35s var(--ease)}
.pw i{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor}
.pw .n{color:var(--gold)}
.buff{position:relative;overflow:hidden}
.buff .t{position:absolute;left:0;bottom:0;height:2px;background:currentColor}
.hud-bc{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;justify-items:center;gap:8px;width:min(360px,60vw)}
#comboWrap{display:grid;justify-items:center;gap:4px;opacity:0;transition:opacity .2s}
#comboWrap.on{opacity:1}
#comboTxt{font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--peach)}
.combo-bar,.boost-bar{width:100%;height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.combo-bar{width:140px}
.combo-bar i,.boost-bar i{display:block;height:100%;border-radius:6px}
.combo-bar i{background:var(--peach)}
.boost-bar i{background:linear-gradient(90deg,var(--mint),var(--violet));transition:width .2s}
.boost{width:100%;display:grid;gap:4px;justify-items:center}
#boostLbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.boost.active .boost-bar i{background:linear-gradient(90deg,var(--peach),var(--rose))}
.boost.free .boost-bar i{background:linear-gradient(90deg,var(--gold),var(--peach))}
#callout{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:900;font-size:clamp(28px,6vw,60px);letter-spacing:-.02em;text-align:center;white-space:nowrap;opacity:0;text-shadow:0 4px 30px rgba(0,0,0,.5)}
#callout.show{animation:callout 1.4s var(--ease) forwards}
#subcallout{position:absolute;left:50%;top:calc(28% + 46px);transform:translateX(-50%);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:0;white-space:nowrap}
#subcallout.show{animation:sub 1.6s var(--ease) forwards}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
@keyframes sub{0%,8%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.reduced #callout.show{animation:fadeOnly 1.4s linear forwards}
@keyframes fadeOnly{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
#vignette{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,40,70,.42) 100%)}
#indicators{position:absolute;inset:0;pointer-events:none}
.ind{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;padding:2px 7px;border-radius:7px;background:rgba(6,5,24,.72);border:1px solid currentColor}
.ind.ok{color:var(--edible)} .ind.bad{color:var(--hazard)} .ind.gold{color:var(--gold)} .ind.warn{color:var(--warn)}
.ind.arrow{width:0;height:0;padding:0;border:0;background:none}
.ind.arrow::before{content:"";position:absolute;left:-9px;top:-9px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid currentColor;transform:rotate(var(--a));filter:drop-shadow(0 0 6px currentColor)}
#pauseBtn{pointer-events:auto;position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:34px;height:28px;border-radius:9px;border:1px solid var(--line);background:rgba(10,8,34,.6);font-weight:700;font-size:12px;letter-spacing:.1em;display:none}
.touch #pauseBtn{display:block}
#deathCard{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;display:grid;gap:6px;padding:20px 28px;border-radius:18px;background:rgba(10,8,34,.72);border:1px solid rgba(255,77,94,.5)}
#deathCard b{font-family:var(--f-display);font-size:28px;color:var(--hazard)}

/* touch */
#touchUI{position:fixed;inset:0;z-index:11;pointer-events:none}
#stickBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);opacity:0;transition:opacity .15s}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(110,243,197,.55);box-shadow:0 0 20px rgba(110,243,197,.45)}
#boostBtn{pointer-events:auto;position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,179,107,.7);background:rgba(255,179,107,.16);font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--peach);touch-action:none}
#boostBtn.on{background:rgba(255,179,107,.45);color:#2a1300}
.stick-hint{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

/* results */
.res-top{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
.res-rank{font-family:var(--f-display);font-weight:900;font-size:56px;line-height:.9;letter-spacing:-.03em}
.res-rank small{font-size:16px;color:var(--muted);letter-spacing:0}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;background:rgba(255,211,107,.16);border:1px solid rgba(255,211,107,.5);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-left:6px}
.win{color:var(--mint)} .lose{color:var(--rose)}

@media (max-width:640px){
  #menu{align-items:flex-start;background:linear-gradient(180deg,rgba(5,4,26,.9) 0%,rgba(5,4,26,.75) 60%,rgba(5,4,26,.4) 100%)}
  .menu-col{margin-left:0}
  #minimap{width:104px;height:104px}
  #hBoard{display:none}
  #feed{top:calc(130px + env(safe-area-inset-top,0px))}
  .hud-bc{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .panel{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>


<canvas id="gl" tabindex="0" aria-label="Space Worm 3D arena"></canvas>

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

function distSegSq(px, pz, ax, az, bx, bz) {
  const abx = bx - ax, abz = bz - az; const l = abx * abx + abz * abz;
  let t = l ? ((px - ax) * abx + (pz - az) * abz) / l : 0; t = clamp(t, 0, 1);
  const dx = ax + abx * t - px, dz = az + abz * t - pz; return dx * dx + dz * dz;
}
function segCross(ax, az, bx, bz, cx, cz, dx, dz) {
  const d = (bx - ax) * (dz - cz) - (bz - az) * (dx - cx); if (Math.abs(d) < 1e-9) return false;
  const t = ((cx - ax) * (dz - cz) - (cz - az) * (dx - cx)) / d;
  const u = ((cx - ax) * (bz - az) - (cz - az) * (bx - ax)) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}

/* ---------- opt-in global leaderboard (claude.ai shared store) ---------- */
const CLOUD = { db: null, user: null, id: null, ready: false, tried: false };
async function initCloud() {
  if (CLOUD.tried) return; CLOUD.tried = true;
  try { if (!window.claude || !window.claude.use) return; CLOUD.db = await window.claude.use('db'); CLOUD.user = await window.claude.use('user'); if (CLOUD.user) CLOUD.id = await CLOUD.user.id(); CLOUD.ready = !!(CLOUD.db && CLOUD.id); } catch (e) { CLOUD.ready = false; }
}
async function shareResult(manual) {
  const st = $('#shareStatus'); const setS = s => { if (LAST) LAST.shared = s; const el = $('#shareStatus'); if (el) el.textContent = s; };
  if (!settings.callsign) { setS(t('needCallsign')); return; }
  if (manual) { settings.optIn = true; saveAll(); const c = $('#resShare'); if (c) c.checked = true; }
  await initCloud(); if (!CLOUD.ready) { setS(t('boardUnavail')); return; }
  try {
    const ref = CLOUD.db.doc('scores/' + CLOUD.id), snap = await ref.get(), old = snap.exists ? snap.data() : null;
    if (old && old.score >= LAST.score && old.callsign === settings.callsign) { setS(t('kept')); return; }
    const entry = { callsign: settings.callsign.slice(0, 16), score: Math.max(LAST.score, old && old.score || 0), mode: LAST.score >= (old && old.score || 0) ? LAST.mode : (old.mode || LAST.mode), bites: LAST.score >= (old && old.score || 0) ? LAST.bites : (old.bites || 0), ts: Date.now() };
    await ref.set(entry); setS(t('submitted'));

}
async function loadBoard() {

  await initCloud();
  if (!CLOUD.ready) { el.innerHTML = `<p class="note">${t('boardUnavail')}</p>`; return; }
  try {
    const q = await CLOUD.db.collection('scores').orderBy('score', 'desc').limit(30).get();
    const rows = q.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => typeof r.score === 'number');
    if (!$('#boardBody')) return;
    const mine = settings.optIn ? '' : `<p class="note">${t('boardOff')}</p>`;
    if (!rows.length) { el.innerHTML = mine + `<p class="note">${t('boardEmpty')}</p>`; return; }
    el.innerHTML = mine + `<table class="lb"><thead><tr><th>#</th><th>${t('colPilot')}</th><th>${t('colMode')}</th><th style="text-align:right">${t('colBites')}</th><th style="text-align:right">${t('colScore')}</th></tr></thead><tbody>${rows.map((r, i) => `<tr class="${r.id === CLOUD.id ? 'me' : ''}"><td class="num">${i + 1}</td><td>${escapeHtml(String(r.callsign || '—').slice(0, 16))}</td><td>${r.mode === 'team' ? t('teamShort') : t('ffaShort')}</td><td class="r num">${+r.bites || 0}</td><td class="r num">${Math.round(r.score).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
  } catch (e) { el.innerHTML = `<p class="note">${t('boardUnavail')}</p>`; }
}

/* ---------- main loop ---------- */
let lastT = performance.now(), perf = { acc: 0, n: 0, sum: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000)); lastT = now;
  if (GAME.state === 'load') return;
  pollPad();
  if (!GAME.paused) { applyPlayerInput(); stepWorld(dt); }
  syncVisuals(dt); updateCamera(dt); updateHUD(dt);
  // music intensity follows the action
  const P = GAME.player;
  if (GAME.state === 'play' && P) {
    Snd.intensity = clamp(0.38 + (P.combo || 0) * 0.08 + (P.boosting ? 0.12 : 0) + (GAME.crownHolder === P ? 0.12 : 0) + (GAME.timeLeft < 30 ? 0.2 : 0), 0, 1);
    Snd.boostLevel(P.alive && P.boosting && !GAME.paused);
    if (Snd.boostFilter) Snd.boostFilter.frequency.value = P.freeBoost > 0 ? 900 : 520;
  }
  renderer.render(scene, camera);
  // adaptive resolution
  perf.sum += dt; perf.n++;
  if (perf.n >= 90) { const avg = perf.sum / perf.n; perf.sum = 0; perf.n = 0; const pr = renderer.getPixelRatio(); if (avg > 0.026 && pr > 0.8) { renderer.setPixelRatio(Math.max(0.75, pr - 0.25)); onResize(); } }
}

/* ---------- staged boot ---------- */
const STAGES = ['loadEngine', 'loadTex', 'loadArena', 'loadHaz', 'loadWorms', 'loadWarm'];
async function boot() {
  applyI18n(); document.body.classList.toggle('reduced', settings.reduced);
  const ul = $('#loadStages'); ul.innerHTML = STAGES.map(s => `<li>${t(s)}</li>`).join('');
  const lis = [...ul.children];
  const stage = async i => { lis.forEach((li, j) => { li.className = j < i ? 'done' : j === i ? 'on' : ''; }); $('#loadFill').style.width = (i / STAGES.length * 100) + '%'; await nextFrame(); await nextFrame(); };
  const fail = msg => { const e = $('#loadErr'); e.hidden = false; e.textContent = msg; };
  try { await stage(0); await loadThree(); } catch (e) { fail(t('loadFail')); return; }
  try { initRenderer(); } catch (e) { fail(t('noGL')); return; }
  await stage(1); buildShared();
  await stage(2); buildArena(); buildPellets(); buildParticles(); onResize();
  await stage(3); GFX.crown = makeCrown(); bindInput(); bindPanels();
  await stage(4); startWorld('ffa', true); GAME.state = 'menu';
  await stage(5); try { renderer.compile(scene, camera); } catch (e) { }
  updateCamera(0.016); renderer.render(scene, camera);
  lis.forEach(li => li.className = 'done'); $('#loadFill').style.width = '100%';
  await nextFrame();
  $('#loading').classList.add('out'); setTimeout(() => $('#loading').hidden = true, 650);
  show('#menu', true); updateMenu();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => GAME.worms.forEach(w => w.alive !== undefined && w.vis && setWormLabel(w)));
  // audio needs a user gesture; arm it on first interaction
  const arm = () => { Snd.init(); removeEventListener('pointerdown', arm); removeEventListener('keydown', arm); };
  addEventListener('pointerdown', arm); addEventListener('keydown', arm);
  requestAnimationFrame(frame);
  initCloud();
}
boot();
</script>
